version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: repoforge
      POSTGRES_USER: repoforge
      POSTGRES_PASSWORD: repoforge_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./worker/migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://repoforge:repoforge_dev@postgres:5432/repoforge
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - '8000:8000'
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    command: uvicorn worker.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
